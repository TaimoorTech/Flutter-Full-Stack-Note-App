name: Backend CI

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

jobs:
  lint-and-build:
    name: Lint and Build Backend
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: './note_app_backend/package-lock.json'
      
      - name: Install dependencies
        run: npm ci
        working-directory: ./note_app_backend
      
      - name: Build TypeScript
        run: npm run build
        working-directory: ./note_app_backend
